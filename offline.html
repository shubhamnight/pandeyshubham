<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c0d10">
  <meta name="robots" content="noindex, follow">
  <title>You're offline | Shubham</title>
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/ui/offline-page.css">
  <style>html,body{margin:0;background:#0c0d10;color:#e7ebf0}#offline-root{min-height:100svh}</style>
  <script src="/offline-boot.js" defer></script>
</head>
<body>
  <div id="offline-root">
    <main class="offline-page" aria-labelledby="offline-heading">
      <div class="offline-content">
        <div class="offline-art" aria-hidden="true"><span class="offline-word">OFF</span><div class="offline-batman"><img class="offline-batman-fallback" src="/assets/batman/cursor.svg" width="220" height="150" alt=""></div><span class="offline-word">LINE</span></div>
        <h1 id="offline-heading">Connection missing!</h1>
        <p class="offline-description">Looks like your internet disappeared.<br>Reconnect and let’s pick up where we left off.</p>
        <div class="offline-action"><a class="flow-button" href="/">Try again</a></div>
        <p id="offline-status" class="offline-status" role="status">We’ll bring you back when your connection returns.</p>
      </div>
    </main>
  </div>
  <script type="module" src="/assets/ui/offline-page.js"></script>
</body>
</html>
